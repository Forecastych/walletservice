name: wallet-service

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-wallet}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
  POSTGRES_DB: ${POSTGRES_DB:-wallet}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wallet}
      POSTGRES_DB: ${POSTGRES_DB:-wallet}
      # Deterministic collation, so ordering does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - max_connections=200
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wallet} -d ${POSTGRES_DB:-wallet}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # Not published to the host by default: the database is reachable only from
    # the compose network. Uncomment for local inspection.
    # ports:
    #   - "5432:5432"

  # Runs once per `up`, applies migrations, exits. The API waits for it to
  # complete successfully, so the schema is never half-applied under traffic.
  migrations:
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      <<: *db-env
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  # Test runner. Started explicitly:
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    environment:
      <<: *db-env
      POSTGRES_DB: ${POSTGRES_TEST_DB:-wallet_test}
      ENVIRONMENT: test
    depends_on:
      db:
        condition: service_healthy
    # The test database is separate from the application's, and created on
    # demand so a bare `up` never has to know about it.
    command:
      - sh
      - -c
      - |
        until pg_isready -h db -U "$${POSTGRES_USER}" >/dev/null 2>&1; do sleep 1; done
        PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h db -U "$${POSTGRES_USER}" -d postgres \
          -tc "SELECT 1 FROM pg_database WHERE datname='$${POSTGRES_DB}'" | grep -q 1 || \
        PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h db -U "$${POSTGRES_USER}" -d postgres \
          -c "CREATE DATABASE $${POSTGRES_DB}"
        pytest --cov=app --cov-report=term-missing

volumes:
  postgres-data:
