name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Fails if pyproject.toml and uv.lock have drifted apart, so the lock
      # cannot silently go stale.
      - name: Verify lock file is up to date
        run: uv lock --check --python ${{ env.PYTHON_VERSION }}

      # --frozen forbids re-resolution: the job installs exactly the versions
      # recorded in uv.lock, or it fails. The environment is then put on PATH
      # so the steps below run the locked tools.
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff (lint)
        run: ruff check app tests

      - name: Ruff (format)
        run: ruff format --check app tests

      - name: Mypy
        run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet_test
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev --python ${{ env.PYTHON_VERSION }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify migrations apply cleanly
        env:
          POSTGRES_DB: wallet_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
